name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: kidedu_ci
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: kidedu_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kidedu_ci -d kidedu_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_POOL_URL: postgresql://kidedu_ci:local-ci-only@127.0.0.1:5432/kidedu_ci?schema=public
      DATABASE_MIGRATION_URL: postgresql://kidedu_ci:local-ci-only@127.0.0.1:5432/kidedu_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kidedu/api db:migrate:deploy
      - run: pnpm check
      - run: pnpm check:api
      - run: pnpm --filter @kidedu/api test:db
      - run: docker build -f apps/api/Dockerfile -t kidedu-api:ci .
